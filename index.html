<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QFL Dashboard</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /* Map Tailwind to use CSS custom properties from styles.css */
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- App styles (CSS variables + custom utilities Tailwind cannot express) -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="min-h-screen font-sans" style="background:var(--clr-bg); color:var(--clr-text)">

  <!-- 
       SIDEBAR
   -->
  <aside id="sidebar"
         class="fixed top-0 left-0 h-full flex flex-col z-30 transition-transform duration-300 -translate-x-full md:translate-x-0"
         style="width:var(--sidebar-w); background:var(--clr-surface); border-right:1px solid var(--clr-border)">

    <!-- Logo -->
    <div class="flex items-center gap-3 px-6 py-5" style="border-bottom:1px solid var(--clr-border)">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0"
           style="background:var(--clr-primary)">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"/>
        </svg>
      </div>
      <span class="font-semibold text-white text-sm tracking-wide">QFL Dashboard</span>
    </div>

    <!-- Navigation links  data-route used by router.js for active state -->
    <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
      <p class="text-xs font-semibold uppercase tracking-widest px-3 mb-3"
         style="color:var(--clr-text-faint)">Main</p>

      <a href="#overview" data-route="overview"
         class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium"
         onclick="closeSidebar()">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1
               0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Overview
      </a>

      <a href="#projects" data-route="projects"
         class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium"
         onclick="closeSidebar()">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0
               00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
        </svg>
        Projects
      </a>

      <a href="#clients" data-route="clients"
         class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium"
         onclick="closeSidebar()">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857
               M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002
               5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Clients
      </a>

      <a href="#invoices" data-route="invoices"
         class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium"
         onclick="closeSidebar()">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0
               01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Invoices
      </a>

      <a href="#finances" data-route="finances"
         class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium"
         onclick="closeSidebar()">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0
               2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9
               9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        Finances
      </a>

      <p class="text-xs font-semibold uppercase tracking-widest px-3 mt-6 mb-3"
         style="color:var(--clr-text-faint)">Account</p>

      <a href="#settings" data-route="settings"
         class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium"
         onclick="closeSidebar()">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066
               c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756
               2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724
               1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0
               00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0
               00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0
               001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Settings
      </a>
    </nav>

    <!-- User profile -->
    <div class="px-4 py-4" style="border-top:1px solid var(--clr-border)">
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg" style="background:var(--clr-surface-2)">
        <div class="avatar w-8 h-8 text-white shrink-0 text-xs"
             style="background:linear-gradient(135deg,#60a5fa,#3b82f6)">MF</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-white truncate">Mohammed Fauzan</p>
          <p class="text-xs truncate" style="color:var(--clr-text-faint)">Freelancer  Qatar</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Sidebar overlay  tap outside to close on mobile -->
  <div id="sidebar-overlay"
       class="fixed inset-0 bg-black/60 z-20 hidden md:hidden"
       onclick="closeSidebar()"></div>

  <!-- 
       MAIN CONTENT WRAPPER
   -->
  <div id="main-wrapper" class="flex flex-col min-h-screen transition-all duration-300"
       style="margin-left:0">

    <!-- Top header -->
    <header class="sticky top-0 z-20 px-4 md:px-6 py-4 flex items-center justify-between gap-3"
            style="background:rgba(10,22,40,0.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--clr-border)">

      <div class="flex items-center gap-3">
        <!-- Mobile hamburger -->
        <button onclick="openSidebar()"
                class="md:hidden w-9 h-9 rounded-lg flex items-center justify-center transition btn-icon"
                aria-label="Open menu">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

        <div>
          <h1 id="page-title" class="text-base md:text-lg font-semibold text-white leading-tight">Overview</h1>
          <p id="current-date" class="text-xs" style="color:var(--clr-text-faint)"></p>
        </div>
      </div>

      <!-- Notification bell placeholder -->
      <button class="btn btn-icon" aria-label="Notifications">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0
               00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0
               .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
      </button>
    </header>

    <!-- Active view module renders into this container -->
    <main class="flex-1 w-full px-4 md:px-6 py-6 md:py-8 max-w-full">
      <div id="view-container"></div>
    </main>
  </div>

  <!-- 
       GLOBAL MODAL  (add / edit forms injected by modules)
   -->
  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-box">

      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-4"
           style="border-bottom:1px solid var(--clr-border)">
        <h2 id="modal-title" class="text-base font-semibold text-white"></h2>
        <button id="modal-cancel" class="btn btn-icon" aria-label="Close">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Form  body injected by each module -->
      <form id="modal-form" novalidate>
        <div id="modal-body"></div>

        <!-- Footer actions -->
        <div class="flex items-center justify-end gap-3 px-6 py-4"
             style="border-top:1px solid var(--clr-border)">
          <button type="button" id="modal-cancel-footer" class="btn btn-ghost">Cancel</button>
          <button type="submit"  id="modal-submit"        class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 
       GLOBAL CONFIRM DIALOG  (destructive actions)
   -->
  <div id="confirm-backdrop" class="modal-backdrop hidden" role="alertdialog" aria-modal="true">
    <div class="confirm-box">
      <div class="flex items-start gap-4 mb-5">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
             style="background:var(--clr-danger-bg)">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"
               style="color:var(--clr-danger)">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4
                 c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </div>
        <div>
          <h3 id="confirm-title"   class="font-semibold text-white mb-1"></h3>
          <p  id="confirm-message" class="text-sm" style="color:var(--clr-text-muted)"></p>
        </div>
      </div>
      <div class="flex items-center justify-end gap-3">
        <button id="confirm-cancel" class="btn btn-ghost">Cancel</button>
        <button id="confirm-ok"     class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- 
       TOAST CONTAINER
   -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <!-- 
       APP BOOTSTRAP   ES modules; requires a local HTTP server (Live Server)
   -->
  <script type="module">
    import { initUI, openSidebar, closeSidebar } from './js/ui.js';
    import { initRouter, registerRoute }          from './js/router.js';
    import { mount as overviewMount }             from './js/modules/overview.js';
    import { mount as clientsMount,
             unmount as clientsUnmount }          from './js/modules/clients.js';
    import { mount as projectsMount,
             unmount as projectsUnmount }         from './js/modules/projects.js';
    import { mount as invoicesMount,
             unmount as invoicesUnmount }         from './js/modules/invoices.js';
    import { mount as financesMount,
             unmount as financesUnmount }         from './js/modules/finances.js';

    /* Expose sidebar helpers to inline onclick attributes */
    window.openSidebar  = openSidebar;
    window.closeSidebar = closeSidebar;

    /* Date stamp in header */
    document.getElementById('current-date').textContent =
      new Date().toLocaleDateString('en-US', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      });

    /* Apply/remove sidebar margin based on viewport width */
    function applyLayout() {
      document.getElementById('main-wrapper').style.marginLeft =
        window.innerWidth >= 768 ? 'var(--sidebar-w)' : '0';
    }
    applyLayout();
    window.addEventListener('resize', applyLayout);

    /* Modal footer cancel wires to closeModal */
    document.getElementById('modal-cancel-footer').addEventListener('click', () => {
      import('./js/ui.js').then(m => m.closeModal());
    });

    /*  Route registration  */
    registerRoute('overview',  { mount: overviewMount });
    registerRoute('clients',   { mount: clientsMount,   unmount: clientsUnmount   });
    registerRoute('projects',  { mount: projectsMount,  unmount: projectsUnmount  });
    registerRoute('invoices',  { mount: invoicesMount,  unmount: invoicesUnmount  });
    registerRoute('finances',  { mount: financesMount,  unmount: financesUnmount  });

    /* Stub placeholder for modules not yet implemented */
    const stub = (label) => ({
      mount(el) {
        el.innerHTML = `
          <div class="empty-state" style="padding-top:6rem">
            <svg class="w-14 h-14" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                 style="color:var(--clr-surface-3)">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <p class="font-medium text-lg" style="color:var(--clr-text-muted)">${label}</p>
            <p>Coming soon — this module is not yet implemented.</p>
          </div>`;
      },
    });
    registerRoute('settings',  stub('Settings'));

    /* Init shared UI (modal close, escape key, confirm dialog) */
    initUI();

    /* Start the hash-based router */
    initRouter();
  </script>

</body>
</html>
